<svg width="500" height="230" viewBox="0 0 500 230" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Kuttu logo, digital primary</title>
<desc>An icon where a vertical needle forms the stem of a K, with a thread tied in a knot near the eye at the top and winding along the whole needle down to a plain tip, plus two curved thread arms branching off, inside a flat teal circle, next to the wordmark kuttu set in Fraunces serif type, vertically centred on the circle.</desc>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&amp;family=Manrope:wght@500;600&amp;display=swap');
.wordmark { font-family: 'Fraunces', serif; font-size: 64px; font-weight: 600; fill: #0d5f5f; }
.outline { fill: #f0d78a; stroke: #f0d78a; stroke-width: 7px; stroke-linejoin: round; stroke-linecap: round; }
</style>
<rect width="500" height="230" fill="#ffffff"/>
<circle cx="120" cy="115" r="95" fill="#0d5f5f"/>
<path d="M90,90 Q120,55 165,45" fill="none" stroke="#f0d78a" stroke-width="5" stroke-linecap="round"/>
<path d="M90,140 Q120,175 165,185" fill="none" stroke="#f0d78a" stroke-width="5" stroke-linecap="round"/>
<line x1="90" y1="35" x2="90" y2="195" stroke="#a87d12" stroke-width="9" stroke-linecap="round"/>
<path d="M90,50 C68,75 102,90 78,115 C54,140 102,155 90,190" fill="none" stroke="#f0d78a" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="90" cy="42" rx="7" ry="9" fill="#0d5f5f" stroke="#a87d12" stroke-width="3"/>
<circle cx="90" cy="50" r="6" fill="#8c1c3a"/>
<text x="248" y="134" class="wordmark outline">kuttu</text>
<text x="248" y="134" class="wordmark">kuttu</text>
</svg>
